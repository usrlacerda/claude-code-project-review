name: Markdown Check

on:
  push:
  pull_request:

jobs:
  markdown:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          test -f README.md
          test -f CHANGELOG.md
          test -f templates/review-report.md
          test -f .claude/skills/project-review/SKILL.md
          test -f examples/sample-review.md
